name: Encrypt Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/encrypt-secrets.yaml'

permissions:
  contents: write
  id-token: write

env:
  GOOGLE_PROJECT: ${{ vars.GOOGLE_PROJECT }}
  TARGET_NAMESPACE: "demo" # Could be dynamic or a var
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  KMS_KEY: "projects/${{ vars.GOOGLE_PROJECT }}/locations/global/keyRings/sops-key-ring/cryptoKeys/sops-key"

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/flux-config-gke
          token: ${{ secrets.GH_PAT }}
          path: flux-config

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Fetch Secret
        id: secrets
        run: |
          TOKEN=$(gcloud secrets versions access latest --secret="TELE_TOKEN")
          echo "::add-mask::$TOKEN"
          echo "TELE_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Install SOPS & kubectl
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.8.1/sops-v3.8.1.linux.amd64
          mv sops-v3.8.1.linux.amd64 /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/

      - name: Generate & Encrypt Secret
        working-directory: flux-config
        run: |
          mkdir -p clusters/${{ env.TARGET_NAMESPACE }}/secrets
          
          # Generate Secret YAML (dry-run)
          kubectl create secret generic kbot \
            --namespace=${{ env.TARGET_NAMESPACE }} \
            --from-literal=token="$TELE_TOKEN" \
            --dry-run=client \
            -o yaml > kbot-secret.yaml

          # Encrypt with SOPS
          sops --encrypt \
            --gcp-kms ${{ env.KMS_KEY }} \
            --encrypted-regex '^(data|stringData)$' \
            kbot-secret.yaml > clusters/${{ env.TARGET_NAMESPACE }}/secrets/enc-kbot-secret.yaml
          
          rm kbot-secret.yaml

      - name: Commit & Push
        working-directory: flux-config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clusters/${{ env.TARGET_NAMESPACE }}/secrets/enc-kbot-secret.yaml
          git commit -m "chore: update encrypted kbot secret [skip ci]" || echo "No changes to commit"
          git push
